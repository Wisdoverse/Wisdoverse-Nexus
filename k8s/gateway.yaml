apiVersion: v1
kind: Namespace
metadata:
  name: nexis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexis-gateway
  namespace: nexis
  labels:
    app: nexis-gateway
spec:
  # M1 room/message state is process-local. Do not scale until M3 is qualified.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nexis-gateway
  template:
    metadata:
      labels:
        app: nexis-gateway
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: nexis/gateway:latest
          ports:
            - containerPort: 8080
          env:
            - name: NEXIS_ENV
              value: "production"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: nexis-gateway-auth
                  key: jwt-secret
            - name: NEXIS_BIND_ADDR
              value: "0.0.0.0:8080"
            - name: RUST_LOG
              value: "info"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: nexis-gateway
  namespace: nexis
spec:
  selector:
    app: nexis-gateway
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nexis-gateway
  namespace: nexis
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  rules:
    - host: api.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nexis-gateway
                port:
                  number: 80
