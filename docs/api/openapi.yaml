          description: Swagger UI HTML
  /ws:
    get:
      summary: WebSocket upgrade endpoint
      responses:
        '101':
          description: WebSocket connection established
      description: 'First message: auth {token}; then join_room {room_id}. JWT scope
        and room membership are checked. send_message accepts room_id, content, reply_to
        and client_message_id. message_accepted acknowledges every accepted retry;
        new_message is emitted once on commit. Heartbeat timestamps and event timestamps
        are milliseconds. Reload HTTP history after reconnect. Default single-tenant
        features only.'
