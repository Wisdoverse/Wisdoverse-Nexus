openapi: 3.0.3
info:
  title: Wisdoverse Nexus Gateway API
  version: 0.1.0
  description: Control plane API for room management, messaging, semantic search,
    privacy self-service, and collaboration.
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: Gateway is healthy
  /metrics:
    get:
