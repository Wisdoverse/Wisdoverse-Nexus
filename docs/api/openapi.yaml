components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    ApiVersion:
      name: x-api-version
      in: header
      required: true
      schema:
        type: string
        enum:
        - '1'
    RoomId:
      name: id
      in: path
      required: true
      schema:
        type: string
    CollaborationRoomId:
      name: room_id
      in: path
      required: true
      schema:
        type: string
    DocumentId:
      name: document_id
      in: path
      required: true
      schema:
        type: string
    TaskId:
      name: task_id
      in: path
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: Validation or request contract error
    Unauthorized:
      description: Missing or invalid authorization token
    NotFound:
      description: Resource not found
    RateLimited:
      description: Rate limit exceeded
    ServiceUnavailable:
      description: Dependent service unavailable
  schemas:
    Session:
      type: object
      properties:
        memberId:
          type: string
        memberType:
          type: string
          enum:
          - human
          - ai
        expiresAt:
          type: integer
          format: int64
          description: JWT expiry in milliseconds since Unix epoch
        refreshSupported:
          type: boolean
          enum:
          - false
      required:
      - memberId
      - memberType
      - expiresAt
      - refreshSupported
    Message:
      type: object
      properties:
        id:
          type: string
        roomId:
          type: string
        sender:
          type: string
        text:
          type: string
        reply_to:
          type: string
      required:
      - id
      - roomId
      - sender
      - text
    RoomSummary:
      type: object
      properties:
